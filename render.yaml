services:
  - type: web
    name: belvo-crm-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: belvo-crm-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://belvo-crm.vercel.app,https://belvo-crm.netlify.app,http://localhost:5173

databases:
  - name: belvo-crm-db
    databaseName: belvo_crm
    user: belvo_admin
    plan: free
